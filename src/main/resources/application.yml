spring:
  application:
    name: labtask1

  datasource:
    url: jdbc:postgresql://localhost:5432/labtask_db
    username: postgres
    password: rootroot
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false

  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: 8080